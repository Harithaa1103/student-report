<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student reports</title>
</head>
<style>
    .cointainer{
        text-align: center;
    }
</style>
<body>
    <div class="cointainer">
    <h1>STUDENT REPORTS</h1>
    <label for="Tam">Tamil : </label>
    <input type="number"id="sub1"></input><br><br>
    <label for="Eng">English : </label>
    <input type="number"id="sub2"></input><br><br>
    <label for="Mat">Maths : </label>
    <input type="number"id="sub3"></input><br><br>
    <label for="Sci">Science : </label>
    <input type="number"id="sub4"></input><br><br>
    <label for="Soc">Social :</label>
    <input type="number"id="sub5"></input><br><br>
    <button onclick="marks()">sumbit</button>
    <h1 id="result"></h1></div>
    <script>
        const marks=()=>{
            let Mark1=Number(document.getElementById("sub1").value)
            let Mark2=Number(document.getElementById("sub2").value)
            let Mark3=Number(document.getElementById("sub3").value)
            let Mark4=Number(document.getElementById("sub4").value)
            let Mark5=Number(document.getElementById("sub5").value)
            let total=Mark1+Mark2+Mark3+Mark4+Mark5
            let average=total/5
            if(total<175){
                document.getElementById("result").innerHTML=("Fail"+"you're fail" +" /" +total + " /" + average)
            }
            else if(total>=175){
                document.getElementById("result").innerHTML=("Pass"+"Try to get above 50" +" /"+total + " /" + average)
            }
            else{
                document.getElementById("result").innerHTML=("Try to get centum" +" /"+total + " /" + average)
            }
        }
    </script>
</body>
</html>
